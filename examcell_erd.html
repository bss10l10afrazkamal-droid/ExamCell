<!-- BacktrackingScheduler class -->
<rect x="720" y="105" width="315" height="460" rx="8" class="box-class" stroke-width="2.5"/>
<text x="878" y="126" class="box-title" text-anchor="middle" font-size="13.5px">⭐ BacktrackingScheduler</text>
<text x="878" y="143" class="box-subtitle" text-anchor="middle">extends Scheduler</text>
<line x1="730" y1="152" x2="1025" y2="152" stroke="#4caf50" stroke-width="1.5"/>

<text x="735" y="170" class="box-label">Constructor:</text>
<text x="740" y="187" class="box-detail">+ BacktrackingScheduler(subjects, rooms,</text>
<text x="745" y="202" class="box-detail">       faculty, slots)</text>
<text x="745" y="217" class="box-subtitle">→ calls super() to pass data to Scheduler</text>

<line x1="730" y1="227" x2="1025" y2="227" stroke="#4caf50" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="735" y="244" class="box-label">Public Method (Override):</text>
<rect x="738" y="252" width="288" height="26" rx="3" class="box-method"/>
<text x="882" y="267" class="box-detail" text-anchor="middle">+ schedule(): List&lt;Allocation&gt;  [Override]</text>
<text x="740" y="293" class="box-detail">1. Creates empty result list</text>
<text x="740" y="308" class="box-detail">2. Calls solve(0, result)</text>
<text x="740" y="323" class="box-detail">3. Throws SchedulingException if no solution</text>
<text x="740" y="338" class="box-detail">4. Returns completed schedule list</text>

<line x1="730" y1="348" x2="1025" y2="348" stroke="#4caf50" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="735" y="365" class="box-label">Private Method — The Backtracking Logic:</text>
<rect x="738" y="373" width="288" height="26" rx="3" class="box-method"/>
<text x="882" y="388" class="box-detail" text-anchor="middle">- solve(subjectIndex: int, current: List): boolean</text>
<text x="740" y="413" class="box-detail">Base case: if index &gt;= subjects.size() → true</text>
<text x="740" y="428" class="box-detail">Try each: TimeSlot × Classroom × Faculty</text>
<text x="740" y="443" class="box-detail">If isValid() → add Allocation, recurse</text>
<text x="740" y="458" class="box-detail">If recursion fails → remove last (backtrack)</text>
<text x="740" y="473" class="box-detail">If no combo works → return false</text>

<line x1="730" y1="483" x2="1025" y2="483" stroke="#4caf50" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="735" y="500" class="box-label">Private Method — Constraint Checker:</text>
<rect x="738" y="508" width="288" height="26" rx="3" class="box-method"/>
<text x="882" y="523" class="box-detail" text-anchor="middle">- isValid(subject, slot, room, fac, current): boolean</text>
<text x="740" y="548" class="box-subtitle">Constraint 1: Room not already booked in this slot</text>
<text x="740" y="563" class="box-subtitle">Constraint 2: Faculty not already busy in this slot</text>
<text x="740" y="578" class="box-subtitle">Constraint 3: No batch conflict (same dept+semester)</text>
<text x="740" y="593" class="box-subtitle">Constraint 4: Room capacity &gt;= student count</text>

<path d="M665,225 L700,225 L700,148 L720,148" class="arrow arrow-inherits" marker-end="url(#ar-inherits)" stroke="#8e44ad" fill="none" stroke-width="2"/>
<text x="680" y="197" class="arrow-label" transform="rotate(-90, 680, 197)">extends</text>
